spring:
  mongodb:
    database: ${USER_SERVICE_DB}
    uri: ${USER_SERVICE_DB_URI}
  rabbitmq:
    host: ${RMQ_HOST:localhost}
    port: ${RMQ_PORT:5672}
    username: ${RMQ_USER:guest}
    password: ${RMQ_PASSWORD:guest}
    virtual-host: ${RMQ_VIRTUAL_HOST:/}
    connection-timeout: 30000
    listener:
      simple:
        missing-queues-fatal: false
  cloud:
    stream:
      bindings:
        springCloudBusInput:
          destination: springCloudBus
          group: ecom-user-service-group
server:
  port: 8082
Eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI}
    fetchRegistry: true
    registerWithEureka: true
  instance:
    preferIpAddress: true
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: "*"
logging:
  file:
    name: logs/userService.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB


app:
  message: "Hello from User Service"
